syntax = "proto3";
package domaindocs4s.architecture.lineage.example.grpc;

service UserService {
  rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);
  rpc Deposit (DepositRequest) returns (DepositResponse);
  rpc GetHistory (GetHistoryRequest) returns (GetHistoryResponse);
}

message GetBalanceRequest { int64 user_id = 1; }
message GetBalanceResponse { string balance = 1; }
message DepositRequest { int64 user_id = 1; string amount = 2; string currency = 3; }
message DepositResponse { bool success = 1; }
message GetHistoryRequest { int64 user_id = 1; }
message TransactionProto { int64 id = 1; int64 user_id = 2; string amount = 3; string description = 4; }
message GetHistoryResponse { repeated TransactionProto transactions = 1; }
