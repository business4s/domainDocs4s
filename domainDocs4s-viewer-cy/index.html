<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Viewer (Cytoscape)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #cy {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      font-size: 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      max-width: calc(100vw - 360px);
    }
    #controls span {
      font-weight: 600;
      color: #555;
    }
    #controls button {
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f8f8f8;
      font-size: 11px;
    }
    #controls button:hover {
      background: #e8e8e8;
    }
    #controls button.active {
      background: #4a90d9;
      color: white;
      border-color: #3a7cc5;
    }
    #controls input[type="text"] {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 11px;
      width: 160px;
      outline: none;
    }
    #controls input[type="text"]:focus {
      border-color: #4a90d9;
      box-shadow: 0 0 0 2px rgba(74,144,217,0.2);
    }
    #controls .separator {
      width: 100%;
      height: 0;
      border-top: 1px solid #eee;
      margin: 2px 0;
    }
    #details {
      position: absolute;
      top: 0;
      right: 0;
      width: 320px;
      height: 100%;
      z-index: 5;
      background: white;
      border-left: 1px solid #ddd;
      box-shadow: -2px 0 6px rgba(0,0,0,0.08);
      font-size: 12px;
      overflow-y: auto;
      display: none;
    }
    #details.open { display: block; }
    #details .details-header {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
    }
    #details .details-header button {
      cursor: pointer;
      border: none;
      background: none;
      font-size: 16px;
      color: #999;
      padding: 0 4px;
    }
    #details .details-header button:hover { color: #333; }
    #details .details-section {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
    }
    #details .details-section h4 {
      margin: 0 0 6px 0;
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.5px;
    }
    #details .details-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }
    #details .details-row .label { color: #666; }
    #details .details-row .value { font-weight: 500; color: #333; }
    #details .tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
    }
    #details .tag-read { background: #d4edda; color: #155724; }
    #details .tag-write { background: #f8d7da; color: #721c24; }
    #details .tag-readwrite { background: #fff3cd; color: #856404; }
    #details .tag-pure { background: #f0f0f0; color: #666; }
    #details .method-list { list-style: none; padding: 0; margin: 0; }
    #details .method-list li {
      padding: 3px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #details .method-name { font-family: monospace; font-size: 11px; }
    #details .connection-item {
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #details .connection-name {
      font-weight: 500;
      color: #333;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="cy"></div>
  <div id="mermaid-container" style="display:none;width:100%;height:100%;position:absolute;top:0;left:0;overflow:auto;background:white;padding:60px 20px 20px 20px;box-sizing:border-box;">
    <div id="mermaid-output"></div>
  </div>
  <div id="controls"></div>
  <div id="details"></div>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    import elkLayouts from "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs";
    await mermaid.registerLayoutLoaders(elkLayouts);
    mermaid.initialize({ startOnLoad: false, securityLevel: "loose", maxTextSize: 500000 });
    window.__mermaid = mermaid;
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
